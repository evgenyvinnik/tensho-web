<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="100%" style="stop-color:#2d5f4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Game table area -->
  <rect x="40" y="40" width="1200" height="640" rx="16" fill="#234535" stroke="#1a3a2a" stroke-width="4"/>

  <!-- Score display area -->
  <rect x="80" y="60" width="300" height="80" rx="8" fill="#1a3a2a"/>
  <text x="230" y="110" font-family="sans-serif" font-size="32" fill="#FFD54F" text-anchor="middle">Score: 2,450</text>

  <!-- Target display -->
  <rect x="900" y="60" width="300" height="80" rx="8" fill="#1a3a2a"/>
  <text x="1050" y="110" font-family="sans-serif" font-size="32" fill="#F5F5DC" text-anchor="middle">Target: 3,000</text>

  <!-- Hand area (tiles) -->
  <g transform="translate(140, 520)">
    <rect x="0" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="80" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="160" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="240" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="320" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="400" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="480" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="560" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="640" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="720" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="800" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="880" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
    <rect x="960" y="0" width="70" height="98" rx="6" fill="#F5F5DC" stroke="#ccc" stroke-width="2"/>
  </g>

  <!-- Center display -->
  <text x="640" y="320" font-family="serif" font-size="72" font-weight="bold" fill="#F5F5DC" text-anchor="middle" opacity="0.3">天翔</text>
  <text x="640" y="380" font-family="sans-serif" font-size="28" fill="#F5F5DC" text-anchor="middle" opacity="0.5">TENSHO</text>

  <!-- Action buttons area -->
  <rect x="480" y="420" width="140" height="50" rx="8" fill="#FF5722"/>
  <text x="550" y="452" font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle">PLAY</text>
  <rect x="660" y="420" width="140" height="50" rx="8" fill="#1a3a2a" stroke="#FFD54F" stroke-width="2"/>
  <text x="730" y="452" font-family="sans-serif" font-size="20" fill="#FFD54F" text-anchor="middle">DISCARD</text>
</svg>
