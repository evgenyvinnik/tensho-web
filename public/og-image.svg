<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="100%" style="stop-color:#2d5f4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative pattern -->
  <g opacity="0.1">
    <rect x="50" y="50" width="80" height="112" rx="8" fill="#F5F5DC"/>
    <rect x="150" y="80" width="80" height="112" rx="8" fill="#F5F5DC"/>
    <rect x="970" y="50" width="80" height="112" rx="8" fill="#F5F5DC"/>
    <rect x="1070" y="80" width="80" height="112" rx="8" fill="#F5F5DC"/>
    <rect x="50" y="468" width="80" height="112" rx="8" fill="#F5F5DC"/>
    <rect x="1070" y="468" width="80" height="112" rx="8" fill="#F5F5DC"/>
  </g>

  <!-- Main title -->
  <text x="600" y="260" font-family="serif" font-size="120" font-weight="bold" fill="#F5F5DC" text-anchor="middle" filter="url(#shadow)">天翔</text>
  <text x="600" y="340" font-family="sans-serif" font-size="48" fill="#FFD54F" text-anchor="middle">TENSHO</text>

  <!-- Subtitle -->
  <text x="600" y="420" font-family="sans-serif" font-size="32" fill="#F5F5DC" text-anchor="middle" opacity="0.9">Mahjong Roguelike</text>

  <!-- Tagline -->
  <text x="600" y="480" font-family="sans-serif" font-size="24" fill="#F5F5DC" text-anchor="middle" opacity="0.7">Build powerful hands. Master Yaku patterns. Climb the Acts.</text>

  <!-- Bottom accent -->
  <rect x="400" y="540" width="400" height="4" rx="2" fill="#FF5722"/>
</svg>
