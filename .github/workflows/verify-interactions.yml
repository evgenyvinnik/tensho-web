name: Verify gameplay interactions

on:
  push:
    branches: [codex/interaction-verification]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-surfaces:
    name: Public site, accessibility and save-aware update
    # Playwright 1.57 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Live release.json verified October 22: v1.0.261022-3.
      # Pin its commit, not a second build of the candidate; refresh this baseline
      # when the live manifest changes before the next completion candidate.
      - uses: actions/checkout@v6
        with:
          ref: 790c6f3e1b4fee0dce509188c30d1ba83fb69269
          path: .verification-baseline
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies and pinned browser
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - name: Verify native dialog, tutorial and audio controls
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/tensho-surfaces/native-report
        run: bunx playwright test e2e/dialogs.spec.ts e2e/tutorial-layout.spec.ts e2e/audio.spec.ts --workers=2 --retries=0 --trace=retain-on-failure --output=${{ runner.temp }}/tensho-surfaces/native-results
      - name: Build deployed baseline
        working-directory: .verification-baseline
        env:
          VITE_BASE_PATH: /
          VITE_APP_VERSION: pwa-before
        run: |
          bun install --frozen-lockfile
          bunx vite build --outDir "$RUNNER_TEMP/tensho-pwa-before"
      - name: Build candidate
        env:
          VITE_BASE_PATH: /
          VITE_APP_VERSION: pwa-after
        run: bun run build
      - name: Verify static routes, localized Codex and artwork
        env:
          SKIP_WEB_SERVER: '1'
          VERIFY_STATIC_ROUTES: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4187/
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/tensho-surfaces/static-report
        run: |
          python3 -m http.server 4187 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/dist" > "$RUNNER_TEMP/tensho-surfaces/static-server.log" 2>&1 &
          static_pid=$!
          trap 'kill "$static_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL" -o "$RUNNER_TEMP/tensho-static-index.html"; then break; fi
            sleep 1
          done
          kill -0 "$static_pid"
          cmp "$RUNNER_TEMP/tensho-static-index.html" dist/index.html
          bunx playwright test e2e/static-routes.spec.ts e2e/asset-delivery.spec.ts e2e/catalog-localization.spec.ts e2e/codex-reference.spec.ts --workers=2 --retries=0 --trace=retain-on-failure --output="$RUNNER_TEMP/tensho-surfaces/static-results"
      - name: Verify current-to-candidate update and offline recovery
        run: node scripts/verify-pwa-updates.mjs "$RUNNER_TEMP/tensho-pwa-before" "$GITHUB_WORKSPACE/dist" "$RUNNER_TEMP/tensho-surfaces/pwa"
      - name: Preserve release-surface diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-surfaces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tensho-surfaces
          if-no-files-found: warn
          retention-days: 7

  core-acceptance:
    name: Complete runs and save recovery
    # Playwright 1.57 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pinned Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      # These tests include explicit late-run fixtures that require native Vite.
      # The separate verify job checks the compiled production application.
      - name: Verify complete gameplay and persistence journeys
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/tensho-core/report
        run: bun run test:acceptance --workers=2 --retries=0 --trace=retain-on-failure --output=${{ runner.temp }}/tensho-core/results
      - name: Preserve core acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tensho-core
          if-no-files-found: warn
          retention-days: 7

  verify:
    # Playwright 1.57 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release safeguards and browser runner
        run: node --test scripts/deployment-versioning.test.mjs scripts/gameplay-browser.test.mjs scripts/illustration-delivery.test.mjs
      - name: Verify application tests
        run: bun run test:run --maxWorkers=2
      - name: Build project site
        env:
          VITE_BASE_PATH: /
        run: bun run build
      - name: Verify built gameplay interactions
        uses: ./.github/actions/verify-browser
