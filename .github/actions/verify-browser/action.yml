name: Verify built gameplay interactions
description: Check the production Pages-path app with real desktop and touch input before deployment.
runs:
  using: composite
  steps:
    - name: Install pinned Chromium and system dependencies
      shell: bash
      run: bunx playwright install --with-deps chromium
    - name: Verify production gameplay
      shell: bash
      env:
        GAMEPLAY_BROWSER_ARTIFACTS: ${{ runner.temp }}/tensho-browser
      run: node scripts/verify-gameplay-browser.mjs
    - name: Preserve browser diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gameplay-browser-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/tensho-browser
        if-no-files-found: warn
        retention-days: 7
