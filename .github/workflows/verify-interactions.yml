name: Verify gameplay interactions

on:
  push:
    branches: [codex/interaction-verification]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release safeguards and browser runner
        run: node --test scripts/deployment-versioning.test.mjs scripts/gameplay-browser.test.mjs
      - name: Verify application tests
        run: bun run test:run --maxWorkers=2
      - name: Build project site
        env:
          VITE_BASE_PATH: /tensho-web/
        run: bun run build
      - name: Verify built gameplay interactions
        uses: ./.github/actions/verify-browser
