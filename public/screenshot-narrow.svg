<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="100%" style="stop-color:#2d5f4a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="1280" fill="url(#bg)"/>

  <!-- Status bar area -->
  <rect x="0" y="0" width="720" height="60" fill="#1a3a2a"/>

  <!-- Score display -->
  <rect x="20" y="80" width="680" height="100" rx="12" fill="#234535"/>
  <text x="360" y="120" font-family="sans-serif" font-size="24" fill="#F5F5DC" text-anchor="middle">Act 2 • Round 3</text>
  <text x="360" y="160" font-family="sans-serif" font-size="36" fill="#FFD54F" text-anchor="middle">2,450 / 3,000</text>

  <!-- Decree slots area -->
  <rect x="20" y="200" width="680" height="120" rx="12" fill="#234535"/>
  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="#1a3a2a" stroke="#FFD54F" stroke-width="2"/>
    <rect x="100" y="0" width="80" height="80" rx="8" fill="#1a3a2a" stroke="#FFD54F" stroke-width="2"/>
    <rect x="200" y="0" width="80" height="80" rx="8" fill="#1a3a2a" stroke="#666" stroke-width="2" stroke-dasharray="4"/>
    <rect x="300" y="0" width="80" height="80" rx="8" fill="#1a3a2a" stroke="#666" stroke-width="2" stroke-dasharray="4"/>
    <rect x="400" y="0" width="80" height="80" rx="8" fill="#1a3a2a" stroke="#666" stroke-width="2" stroke-dasharray="4"/>
    <rect x="500" y="0" width="80" height="80" rx="8" fill="#1a3a2a" stroke="#666" stroke-width="2" stroke-dasharray="4"/>
  </g>

  <!-- Game area -->
  <rect x="20" y="340" width="680" height="500" rx="12" fill="#234535"/>
  <text x="360" y="560" font-family="serif" font-size="96" font-weight="bold" fill="#F5F5DC" text-anchor="middle" opacity="0.2">天翔</text>
  <text x="360" y="620" font-family="sans-serif" font-size="32" fill="#F5F5DC" text-anchor="middle" opacity="0.3">TENSHO</text>

  <!-- Hand area -->
  <rect x="20" y="860" width="680" height="180" rx="12" fill="#1a3a2a"/>
  <g transform="translate(40, 880)">
    <rect x="0" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="60" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="120" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="180" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="240" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="300" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="360" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="420" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="480" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="540" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="600" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
  </g>
  <g transform="translate(40, 970)">
    <rect x="0" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
    <rect x="60" y="0" width="56" height="78" rx="4" fill="#F5F5DC" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- Action buttons -->
  <rect x="20" y="1060" width="220" height="60" rx="12" fill="#FF5722"/>
  <text x="130" y="1098" font-family="sans-serif" font-size="24" fill="#fff" text-anchor="middle">PLAY HAND</text>

  <rect x="250" y="1060" width="220" height="60" rx="12" fill="#1a3a2a" stroke="#FFD54F" stroke-width="2"/>
  <text x="360" y="1098" font-family="sans-serif" font-size="24" fill="#FFD54F" text-anchor="middle">DISCARD</text>

  <rect x="480" y="1060" width="220" height="60" rx="12" fill="#1a3a2a" stroke="#F5F5DC" stroke-width="2"/>
  <text x="590" y="1098" font-family="sans-serif" font-size="24" fill="#F5F5DC" text-anchor="middle">REDRAW</text>

  <!-- Resources -->
  <rect x="20" y="1140" width="680" height="60" rx="12" fill="#234535"/>
  <text x="100" y="1178" font-family="sans-serif" font-size="20" fill="#F5F5DC" text-anchor="middle">Hands: 3</text>
  <text x="260" y="1178" font-family="sans-serif" font-size="20" fill="#F5F5DC" text-anchor="middle">Discards: 2</text>
  <text x="440" y="1178" font-family="sans-serif" font-size="20" fill="#F5F5DC" text-anchor="middle">Redraws: 1</text>
  <text x="600" y="1178" font-family="sans-serif" font-size="20" fill="#FFD54F" text-anchor="middle">Gold: $12</text>

  <!-- Bottom nav hint -->
  <rect x="320" y="1240" width="80" height="6" rx="3" fill="#F5F5DC" opacity="0.3"/>
</svg>
